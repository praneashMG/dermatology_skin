<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/fav.png" type="image/jpeg">
    <title>Page Not Found · Skin Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================
           THEME VARIABLES - TEAL & BLUE
        ========================= */
        :root,
        html[data-theme='light'] {
            --color-background: #FFFFFF;
            --color-primary-text: #000000;
            --color-secondary-text: #4B5563;
            --color-primary: #0F766E; /* Teal */
            --color-secondary: #0ea5e9; /* Light blue */
            --color-accent: #0F766E; /* Teal */
            --color-border: #E5E7EB;
            --color-hover: #F0FDF4;
            --color-footer-bg: #042F2E;
            --color-footer-text: #FFFFFF;
            --color-card-bg: #FFFFFF;
        }

        html[data-theme='dark'] {
            --color-background: #09090B; /* Near Black */
            --color-primary-text: #FFFFFF;
            --color-secondary-text: #9CA3AF;
            --color-primary: #14B8A6; /* Teal */
            --color-secondary: #38BDF8; /* Light blue */
            --color-accent: #14B8A6; /* Teal */
            --color-border: #27272A;
            --color-hover: #134E4A;
            --color-footer-bg: #000000;
            --color-footer-text: #FFFFFF;
            --color-card-bg: #18181B; /* Dark Gray */
        }

        html,
        body {
            background: var(--color-background);
            color: var(--color-primary-text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        .bg-primary { background-color: var(--color-primary); }
        .bg-accent { background-color: var(--color-accent); }
        .bg-card-bg { background-color: var(--color-card-bg); }
        .bg-secondary { background-color: var(--color-secondary); }
        .bg-gradient-primary-accent {
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
        }
        .hover\:bg-primary:hover { background-color: var(--color-primary); }
        .hover\:bg-accent:hover { background-color: var(--color-accent); }
        .hover\:bg-secondary:hover { background-color: var(--color-secondary); }

        .text-primary-text { color: var(--color-primary-text); }
        .text-secondary-text { color: var(--color-secondary-text); }
        .text-accent { color: var(--color-accent); }
        .text-primary { color: var(--color-primary); }
        .hover\:text-primary:hover { color: var(--color-primary); }
        .text-secondary { color: var(--color-secondary); }

        .bg-background { background-color: var(--color-background); }
        .bg-hover { background-color: var(--color-hover); }
        .border-border { border-color: var(--color-border); }

        /* =========================
           BUTTONS
        ========================= */
        .btn-primary {
            background-color: var(--color-primary);
            color: var(--color-background) !important;
            border: 2px solid var(--color-primary);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: var(--color-secondary);
            border-color: var(--color-secondary);
            color: var(--color-background) !important;
            box-shadow: 0 10px 20px -5px rgba(15, 118, 110, 0.4);
            transform: translateY(-2px);
        }

        .btn-accent {
            background-color: transparent;
            color: var(--color-accent) !important;
            border: 2px solid var(--color-accent);
            transition: all 0.3s ease;
        }
        .btn-accent:hover {
            background-color: var(--color-accent);
            color: var(--color-background) !important;
            border-color: var(--color-accent);
            box-shadow: 0 10px 20px -5px rgba(15, 118, 110, 0.3);
            transform: translateY(-2px);
        }

        /* =========================
           404 SPECIFIC
        ========================= */
        .gradient-text {
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent), var(--color-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding-bottom: 0.1em;
        }

        /* Floating animation for the 404 number */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }

        /* Decorative blobs */
        .blob {
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            position: absolute;
            pointer-events: none;
        }

        /* Particle bg (reuse from main) */
        .particle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background-color: var(--color-accent);
            border-radius: 50%;
            opacity: 0.15;
            animation: floatParticle 12s infinite ease-in-out;
        }
        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        /* RTL fix for dropdown (not needed here but kept for consistency) */
        html[dir="rtl"] .dropdown-menu {
            left: auto;
            right: 0;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex items-center justify-center p-4 relative">

    <!-- Theme toggle (top corner, minimal) -->
    <div class="fixed top-6 right-6 z-50">
        <button id="theme-toggle"
            class="text-primary hover:text-accent p-3 rounded-full transition duration-200 bg-hover/70 border border-border/60 backdrop-blur-sm shadow-sm">
            <svg class="w-6 h-6 light-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                </path>
            </svg>
            <svg class="w-6 h-6 dark-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                </path>
            </svg>
        </button>
    </div>

    <!-- Background decorative shapes -->
    <div class="blob w-[500px] h-[500px] -top-40 -right-40" style="background: var(--color-primary);"></div>
    <div class="blob w-[600px] h-[600px] -bottom-60 -left-40" style="background: var(--color-secondary);"></div>
    <div class="blob w-[300px] h-[300px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
        style="background: var(--color-accent); opacity: 0.03;"></div>

    <!-- Floating particles -->
    <div class="particle-bg" id="particles"></div>

    <!-- Main 404 Content -->
    <main class="relative z-10 w-full max-w-3xl mx-auto">
        <div
            class="bg-card-bg/80 backdrop-blur-sm rounded-3xl border border-border/60 shadow-2xl p-8 sm:p-12 lg:p-16 text-center transition-all duration-300">

            <!-- 404 graphic with medical icon -->
            <div class="float-animation inline-block mb-4">
                <span
                    class="text-[7rem] sm:text-[9rem] leading-none font-serif font-black tracking-tighter text-primary select-none drop-shadow-sm">
                    4<span class="inline-block mx-1 sm:mx-2"><i
                            class="fa-solid fa-hand-holding-heart text-[4rem] sm:text-[5.5rem] align-middle text-accent"></i></span>4
                </span>
            </div>

            <!-- Heading -->
            <h1 class="text-primary-text !text-3xl sm:!text-4xl md:!text-5xl mt-2 mb-4 font-serif font-bold">
                Oops! Page not found
            </h1>

            <!-- Description -->
            <p class="text-secondary-text text-base sm:text-lg leading-relaxed max-w-xl mx-auto mb-8">
                The page you're looking for doesn't exist or has been moved.
                But don't worry — your skin health is still our priority.
            </p>

            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="index.html"
                    class="btn-primary px-8 py-3.5 rounded-lg font-semibold text-sm inline-flex items-center justify-center gap-2 shadow-lg shadow-primary/25 w-full sm:w-auto">
                    <i class="fa-solid fa-house"></i> Back to Home
                </a>
                <a href="appointment.html"
                    class="btn-accent px-8 py-3.5 rounded-lg font-semibold text-sm inline-flex items-center justify-center gap-2 w-full sm:w-auto">
                    <i class="fa-solid fa-calendar-check"></i> Book Appointment
                </a>
            </div>

            <!-- Quick links separator -->
            <div class="relative mt-10 pt-6 border-t border-border/60">
                <p class="text-xs uppercase tracking-widest text-secondary-text mb-3 font-semibold">Quick links</p>
                <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-sm">
                    <a href="index.html"
                        class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Home
                    </a>
                    <a href="treatments.html"
                        class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Treatments
                    </a>
                    <a href="doctors.html"
                        class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Doctors
                    </a>
                    <a href="about.html"
                        class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> About
                    </a>
                    <a href="contact.html"
                        class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Contact
                    </a>
                </div>
            </div>
        </div>

        <!-- Tiny brand watermark -->
        <div class="text-center mt-6">
            <span class="text-xs text-secondary-text/60 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-spa text-accent/40 text-sm"></i> Skin Clinic · Dermatology & Skin Care
            </span>
        </div>
    </main>

    <!-- SCRIPT (theme toggle + particles only) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;

            // Theme Switcher
            const themeToggle = document.getElementById('theme-toggle');

            const applyTheme = (theme) => {
                html.setAttribute('data-theme', theme);
                document.querySelectorAll('.light-icon').forEach(i => i.classList.toggle('hidden', theme === 'dark'));
                document.querySelectorAll('.dark-icon').forEach(i => i.classList.toggle('hidden', theme === 'light'));
                localStorage.setItem('theme', theme);
            };

            themeToggle?.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(next);
            });

            // Apply saved theme or system preference
            const stored = localStorage.getItem('theme');
            const pref = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(stored === 'dark' || (!stored && pref) ? 'dark' : 'light');

            // Particles (subtle floating dots)
            const particlesDiv = document.getElementById('particles');
            if (particlesDiv) {
                for (let i = 0; i < 25; i++) {
                    let p = document.createElement('div');
                    p.classList.add('particle');
                    let size = Math.random() * 6 + 2;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 5 + 's';
                    p.style.animationDuration = Math.random() * 12 + 8 + 's';
                    particlesDiv.appendChild(p);
                }
            }
        });
    </script>
</body>

</html>
